<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mathe Tricks Trainer – App-Icon.
       Motiv: die vier Rechenzeichen (+ − × ÷), ein Blitz fuer "schnell mit Trick",
       aussen der ablaufende Zeit-Ring wie in der App. Farben: Nachtblau, Tuerkis,
       Koralle, Bernstein. Vollflaechig, ohne Transparenz, kein Text. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#2A3F86"/>
      <stop offset="0.55" stop-color="#1A2A5E"/>
      <stop offset="1" stop-color="#0E1835"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD15C"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Zeit-Ring: Spur, Restzeit tuerkis, Ende koralle -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="#24376F" stroke-width="48"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#2EC4B6" stroke-width="48" stroke-linecap="round"
          stroke-dasharray="1780 2451" transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#FF7A59" stroke-width="48" stroke-linecap="round"
          stroke-dasharray="250 2451" stroke-dashoffset="-1860" transform="rotate(-90 512 512)"/>

  <!-- Plus (weiss), oben links -->
  <g transform="translate(372 372)" fill="#FFFFFF">
    <rect x="-26" y="-92" width="52" height="184" rx="26"/>
    <rect x="-92" y="-26" width="184" height="52" rx="26"/>
  </g>
  <!-- Mal (koralle), oben rechts -->
  <g transform="translate(652 372) rotate(45)" fill="#FF7A59">
    <rect x="-26" y="-92" width="52" height="184" rx="26"/>
    <rect x="-92" y="-26" width="184" height="52" rx="26"/>
  </g>
  <!-- Minus (tuerkis), unten links -->
  <g transform="translate(372 652)" fill="#2EC4B6">
    <rect x="-92" y="-26" width="184" height="52" rx="26"/>
  </g>
  <!-- Geteilt (hellblau), unten rechts -->
  <g transform="translate(652 652)" fill="#9FC2FF">
    <rect x="-92" y="-24" width="184" height="48" rx="24"/>
    <circle cx="0" cy="-74" r="30"/>
    <circle cx="0" cy="74" r="30"/>
  </g>

  <!-- Blitz in der Mitte -->
  <g transform="translate(512 512) rotate(10)">
    <path d="M30 -300 L-150 45 L-25 45 L-80 300 L150 -60 L20 -60 L95 -300 Z"
          fill="#0E1835" opacity="0.45" transform="translate(14 16)"/>
    <path d="M30 -300 L-150 45 L-25 45 L-80 300 L150 -60 L20 -60 L95 -300 Z"
          fill="url(#bolt)" stroke="#0E1835" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
