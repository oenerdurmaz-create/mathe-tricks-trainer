<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mathe Tricks Trainer</title>
<style>
/* ===== Mathe Tricks Trainer ===== */
:root{
  --bg1:#0F1B3D;--bg2:#1C2D63;--ink:#13203F;--muted:#5B6787;--card:#F6F8FF;--line:#DCE3F5;
  --turq:#2EC4B6;--turq-d:#138F84;--coral:#FF7A59;--coral-d:#D9502F;--amber:#FFB020;--red:#FF4D5E;
  --key:#24376F;--key-hi:#30478A;--white:#FFFFFF;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg1);overflow:hidden}
body{font-family:var(--font);color:var(--white);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
  background:radial-gradient(120% 60% at 50% 0%,var(--bg2) 0%,var(--bg1) 70%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.num{direction:ltr;unicode-bidi:isolate}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 10px)}

/* --- Kopfzeile / Icons */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.10);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.icon-btn:active{background:rgba(255,255,255,.2)}
html[dir="rtl"] .flip{transform:scaleX(-1)}

/* --- Startseite */
.home-head{text-align:center;margin:6px 0 14px}
.brand-mark{width:64px;height:64px;margin:0 auto 8px;border-radius:20px;background:linear-gradient(145deg,var(--turq),#1F7FBF);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 8px 22px rgba(46,196,182,.35)}
.home-head h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.2px}
.home-head p{margin:4px 0 0;font-size:16px;font-weight:700;color:#B7C3E8}
.section-title{font-size:15px;font-weight:900;color:#B7C3E8;margin:6px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
.grade-tabs{display:flex;gap:6px;margin:0 0 10px}
.grade-tabs button{flex:1;padding:9px 4px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:900;font-size:15px;color:#C9D3F2}
.grade-tabs button.on{background:var(--turq);color:var(--ink)}
.trick-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.trick-card{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:22px;background:var(--card);color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.trick-card:active{transform:scale(.98)}
.tc-icon{flex:0 0 56px;height:56px;border-radius:18px;background:#E6F7F5;display:flex;align-items:center;justify-content:center;font-size:32px}
.tc-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tc-copy b{font-size:19px;font-weight:900}
.tc-ex{font-size:17px;font-weight:800;color:var(--turq-d)}
.tc-meta{font-size:13px;font-weight:800;color:var(--muted)}
.tc-sub{font-size:14px;font-weight:800;color:var(--turq-d)}
.tc-profi{display:inline-block;padding:1px 8px;border-radius:999px;background:#FFE9E2;color:var(--coral-d);font-weight:900}
.trick-card.mix{background:linear-gradient(135deg,#E6F7F5,#FFF1EC);border:2px solid #9FE3DC}
.trick-card.mix .tc-icon{background:#fff}
.tc-best{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:14px;background:#FFE9E2;color:var(--coral-d);font-weight:900}
.tc-best .sym{font-size:16px;line-height:1.2}
.tc-best b{font-size:22px;line-height:1.1}
.tc-play{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--turq);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}

/* --- Challenge */
#challengeScreen{gap:8px}
.ch-top{display:flex;align-items:center;gap:8px}
.ch-top .ch-title{flex:1;text-align:center;font-weight:900;font-size:15px;color:#B7C3E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;justify-content:center;gap:0;height:clamp(52px,7.4vh,64px);border-radius:18px;font-weight:900;font-size:clamp(20px,3.1vh,26px);letter-spacing:.5px;white-space:nowrap}
.tile.score{background:linear-gradient(160deg,#3FD6C7,var(--turq));color:var(--ink);box-shadow:0 5px 0 var(--turq-d)}
.tile.best{background:linear-gradient(160deg,#FF9576,var(--coral));color:var(--ink);box-shadow:0 5px 0 var(--coral-d)}
.tile.best.beaten{animation:bestGlow 1s ease-in-out infinite}
@keyframes bestGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.tile b{font-size:1.25em;margin-inline-start:10px}
.tile .sym{font-size:1.15em;line-height:1}
.tile.pop b{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.timebar{position:relative;height:clamp(30px,4.2vh,36px);border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.timebar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:var(--turq);transition:background-color .3s}
.timebar.warn .fill{background:var(--amber)}
.timebar.alert .fill{background:var(--red)}
.timebar.alert{animation:barPulse .6s ease-in-out infinite}
@keyframes barPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}50%{box-shadow:0 0 0 4px rgba(255,77,94,.35)}}
.timebar .ttext{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-weight:900;font-size:clamp(16px,2.3vh,19px);color:var(--white);background:rgba(15,27,61,.82);padding:2px 10px;border-radius:999px;line-height:1.2}
.timebar .countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-weight:900;font-size:clamp(20px,2.8vh,24px);color:#8FF0E6;background:rgba(15,27,61,.9);letter-spacing:1px;border:2px solid var(--turq);border-radius:999px}
.timebar.counting .countdown{display:flex}
.trickbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.10);font-size:clamp(15px,2.1vh,17px);font-weight:800;white-space:nowrap;overflow:hidden}
.trickbar .tb-icon{font-size:1.3em}
.trickbar .tb-name{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.trickbar .tb-sep{opacity:.6}
.trickbar .tb-ex{color:#8FF0E6;flex:0 0 auto}
.taskcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 12px 8px;border-radius:24px;background:var(--card);color:var(--ink);overflow:hidden;position:relative}
.taskcard.wrong{animation:shake .35s}
.taskcard.right{box-shadow:inset 0 0 0 4px var(--turq)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.task-eq{width:100%;text-align:center;overflow:hidden;font-size:clamp(32px,5vh,42px);font-weight:900;direction:ltr;unicode-bidi:isolate;white-space:nowrap;letter-spacing:.5px}
.ans-box{display:inline-block;min-width:1.6em;padding:0 .2em;border-radius:12px;border:3px dashed var(--amber);background:#FFF5DC;color:#A86200;text-align:center;line-height:1.2}
.ans-box.filled{border-style:solid;border-color:var(--turq);background:#E6F7F5;color:var(--turq-d)}
.ans-box.ok{border-color:var(--turq);background:var(--turq);color:var(--white)}
.task-help{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0}
.task-help.tight{gap:3px}
.task-help.noask .task-ask{display:none}
.taskcard.scroll{overflow-y:auto}
@media (max-height:720px){.screen{padding-top:calc(var(--safe-t) + 6px);padding-bottom:calc(var(--safe-b) + 6px)}#challengeScreen{gap:6px}.icon-btn{width:38px;height:38px;flex-basis:38px;font-size:19px}.topbar,.ch-top{min-height:38px}.tile{height:44px;font-size:20px}.timebar{height:28px;margin-top:2px}.trickbar{padding:5px 10px}.taskcard{padding:8px 10px 6px;gap:4px}.task-eq{font-size:30px}.keypad{gap:6px}.key{height:42px;font-size:23px}.brand-mark{display:none}.home-head{margin:0 0 10px}.home-head h1{font-size:26px}}
.task-help.tight .task-ask{font-size:13px}
.task-help.tight .tk-steplist{gap:3px}
.task-help.tight .tk-steplist li{padding:3px 8px}
.task-help.tight .tk-steplist .trick-eq{font-size:17px}
.task-help.tight .tk-steplist li.tk-long .trick-eq{font-size:16px}
.task-help.tight .tk-step-n{flex-basis:22px;height:22px;font-size:13px}
.task-help.tight .tk-step-l{font-size:12px}
.task-ask{margin:0;text-align:center;font-size:clamp(14px,2vh,16px);font-weight:800;color:var(--muted);line-height:1.3}
.show-trick{margin-top:auto;margin-bottom:auto;padding:12px 20px;border-radius:999px;background:#E6F7F5;color:var(--turq-d);font-weight:900;font-size:18px;border:2px solid #B9ECE6}
.feedback{font-weight:900;font-size:clamp(14px,2vh,16px);text-align:center;line-height:1.3}
.feedback:empty{display:none}
.feedback.ok{color:var(--turq-d)}
.feedback.bad{color:var(--coral-d)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.key{height:clamp(46px,6.6vh,58px);border-radius:16px;background:var(--key);color:var(--white);font-size:clamp(24px,3.4vh,30px);font-weight:900;box-shadow:0 4px 0 #142350}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #142350;background:var(--key-hi)}
.key.back{background:#3A4670}
.key.ok{background:var(--turq);color:var(--ink);box-shadow:0 4px 0 var(--turq-d)}
.keypad.locked .key{opacity:.45;pointer-events:none}

/* --- Bilder und Schritte (Trick-Engine) */
.tk-visual{display:flex;flex-direction:column;align-items:center;gap:6px}
.trick-eq{font-weight:900;direction:ltr;unicode-bidi:isolate;text-align:center}
.tk-q{display:inline-block;min-width:34px;padding:0 5px;border-radius:9px;background:#FFF5DC;border:2px dashed var(--amber);color:#A86200;text-align:center}
.tk-ans{color:var(--turq-d)}
.dot{display:inline-block;width:24px;height:24px;border-radius:50%}
.dot.a{background:var(--coral);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.dot.b{background:var(--turq);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.dot.empty{background:#fff;border:3px dashed #A9B5D9}
.dot.none{background:transparent}
.dot.sm{width:13px;height:13px}
.dot.xs{width:12px;height:12px}
.dot.gap{margin-left:10px}
.tk-tens{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tk-ten{display:grid;grid-template-columns:repeat(5,clamp(22px,3.6vh,34px));gap:6px;padding:8px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.tk-ten .dot{width:clamp(22px,3.6vh,34px);height:clamp(22px,3.6vh,34px)}
.tk-tens.two .tk-ten{grid-template-columns:repeat(5,20px);gap:4px;padding:6px}
.tk-tens.two .tk-ten .dot{width:20px;height:20px}
.tk-five{display:flex;flex-direction:column;gap:6px}
.tk-five-row{display:flex;align-items:center;gap:8px}
.tk-five-row b{width:22px;font-size:20px;text-align:right}
.tk-dots{display:flex;gap:4px}
.tk-dots .dot,.tk-split .dot{width:20px;height:20px}
.tk-split{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.tk-house{display:flex;flex-direction:column;align-items:center;gap:5px}
.tk-row{display:flex;gap:5px}
.tk-stone{min-width:54px;height:44px;padding:0 6px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:900}
.tk-stone.q{border-style:dashed;border-color:var(--amber);background:#FFF5DC}
.tk-place{display:flex;flex-direction:column;gap:6px}
.tk-place-row{display:flex;align-items:center;gap:8px;min-height:34px}
.tk-place-row b{min-width:30px;font-size:18px;text-align:right}
.tk-rods{display:flex;gap:3px}
.rod{display:inline-block;width:9px;height:34px;border-radius:4px;background:var(--coral)}
.rod.b{background:var(--turq)}
.tk-place .tk-dots{display:flex;flex-wrap:wrap;gap:3px;max-width:90px}
.tk-jumps{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;direction:ltr}
.tk-jchip{padding:5px 10px;border-radius:12px;background:#E6F7F5;border:2px solid #9FE3DC;font-weight:900;font-size:18px}
.tk-jchip.q{background:#fff;border-style:dashed;border-color:var(--amber);color:#A86200}
.tk-jchip.part{background:#FFE9E2;border-color:#FFB9A6}
.tk-jarrow{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:900;color:var(--turq-d);line-height:1}
.tk-jarrow i{font-style:normal;font-size:18px}
.tk-grid{display:grid;gap:3px;padding:6px;border-radius:12px;background:#fff;border:2px solid var(--line);max-width:300px}
.tk-grid .dot.gap{margin-left:6px}
.tk-fingers{display:flex;align-items:flex-end;gap:4px;height:58px}
.finger{display:inline-block;width:16px;height:52px;border-radius:9px 9px 4px 4px;background:#FFD7C8;border:2px solid #F0A58F}
.finger.l{background:var(--coral)}
.finger.r{background:var(--turq);border-color:var(--turq-d)}
.finger.down{height:18px;background:#ddd;border-color:#bbb}
.finger.gap{margin-left:12px}
.tk-fingers-note{font-size:20px;font-weight:900}
.tk-fingers-note .l{color:var(--coral-d)}.tk-fingers-note .r{color:var(--turq-d)}
.tk-eight{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.tk-eight-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800;padding:1px 8px;border-radius:8px}
.tk-eight-row.now{background:#FFF5DC}
.tk-eight-row b i{font-style:normal}
.tk-eight-row .t{color:#1F7FBF}.tk-eight-row .u{color:var(--coral-d)}
.tk-cross{border-collapse:separate;border-spacing:4px;font-weight:900;font-size:18px}
.tk-cross th{background:#E6F7F5;color:var(--turq-d);border-radius:10px;padding:6px 12px}
.tk-cross td{background:#FFF5DC;color:#7A4B00;border-radius:10px;padding:8px 14px;text-align:center;min-width:44px}
.tk-cross tr:first-child th:first-child{background:var(--ink);color:#fff}
.tk-steplist{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;width:100%}
.tk-steplist li{display:flex;align-items:center;gap:8px;background:#EEF2FC;border-radius:14px;padding:5px 10px}
.tk-step-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.tk-step-l{flex:1;font-size:14px;font-weight:800;color:var(--muted);min-width:0}
.tk-steplist .trick-eq{font-size:20px;text-align:end;white-space:nowrap}
.tk-steplist li.tk-long{flex-wrap:wrap}
.tk-steplist li.tk-long .trick-eq{flex:1 0 100%;font-size:18px;text-align:center;white-space:normal}

/* --- Overlays */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);background:rgba(6,12,30,.72)}
.overlay.open{display:flex}
.sheet{position:relative;width:100%;max-width:420px;max-height:100%;overflow-y:auto;border-radius:28px;background:var(--card);color:var(--ink);padding:22px 18px 18px}
.sheet h2{margin:0 44px 10px 0;font-size:24px;font-weight:900}
html[dir="rtl"] .sheet h2{margin:0 0 10px 44px}
.sheet h3{margin:14px 0 4px;font-size:17px;font-weight:900}
.sheet p{margin:0;font-size:16px;line-height:1.4;font-weight:600;color:#33405F}
.sheet .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:#E8ECF7;font-size:18px;font-weight:900;color:var(--ink)}
html[dir="rtl"] .sheet .close{right:auto;left:14px}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:900;font-size:19px;margin-top:10px}
.btn.primary{background:var(--turq);color:var(--ink);box-shadow:0 4px 0 var(--turq-d)}
.btn.secondary{background:#E8ECF7;color:var(--ink)}
.result{text-align:center}
.result .r-emoji{font-size:58px;line-height:1.1}
.result h2{margin:4px 0 8px}
.result .r-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.result .r-tile{border-radius:18px;padding:10px 6px;font-weight:900}
.result .r-tile .sym{display:block;font-size:24px;line-height:1.2}
.result .r-tile b{display:block;font-size:34px;line-height:1.15}
.result .r-tile.score{background:#D6F5F1;color:var(--turq-d)}
.result .r-tile.best{background:#FFE4DB;color:var(--coral-d)}
.result .r-record{font-size:20px;font-weight:900;color:var(--coral-d);margin:4px 0}
.result .r-solution{margin:8px 0 2px;padding:10px;border-radius:16px;background:#EEF2FC}
.result .r-solution small{display:block;font-size:14px;font-weight:800;color:var(--muted)}
.result .r-solution .trick-eq{font-size:26px}
.lang-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lang-list button{padding:11px 8px;border-radius:14px;background:#E8ECF7;font-weight:800;font-size:15px;text-align:start}
.lang-list button.on{background:var(--turq);color:var(--ink)}
.lang-list button.wide{grid-column:1/-1}
.toggle-row{display:flex;gap:8px;margin-top:6px}
.toggle-row button{flex:1;padding:12px;border-radius:14px;background:#E8ECF7;font-weight:900;font-size:16px}
.toggle-row button.on{background:var(--turq);color:var(--ink)}
.pause-sheet{text-align:center}
.pause-sheet .p-emoji{font-size:54px}
</style>
</head>
<body>

<!-- Startseite: Trick-Auswahl -->
<section id="homeScreen" class="screen">
  <div class="topbar">
    <button id="helpBtn" class="icon-btn" type="button" aria-label="Hilfe" data-i18n-aria="help">❓</button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Einstellungen" data-i18n-aria="settings">⚙️</button>
  </div>
  <div class="home-head">
    <div class="brand-mark" aria-hidden="true">⚡</div>
    <h1 data-i18n="appTitle">Mathe Tricks Trainer</h1>
    <p data-i18n="appSubtitle">Rechentricks gegen die Zeit</p>
  </div>
  <div id="gradeTabs" class="grade-tabs"></div>
  <div class="section-title" data-i18n="chooseTrick">Wähle einen Trick</div>
  <div id="trickList" class="trick-list"></div>
</section>

<!-- Challenge: alles auf einem Bildschirm -->
<section id="challengeScreen" class="screen hidden">
  <div class="ch-top">
    <button id="backBtn" class="icon-btn" type="button" aria-label="Zurück" data-i18n-aria="back"><span class="flip">←</span></button>
    <div id="chTitle" class="ch-title"></div>
    <button id="soundBtn" class="icon-btn" type="button" aria-label="Töne" data-i18n-aria="sound">🔊</button>
  </div>
  <div class="tiles">
    <div id="scoreTile" class="tile score" role="group" aria-label="Score" data-i18n-aria="score"><span class="sym" aria-hidden="true">🎯</span><b id="scoreVal" class="num">0</b></div>
    <div id="bestTile" class="tile best" role="group" aria-label="Best" data-i18n-aria="best"><span class="sym" aria-hidden="true">🏆</span><b id="bestVal" class="num">0</b></div>
  </div>
  <div id="timeBar" class="timebar" dir="ltr">
    <div id="timeFill" class="fill"></div>
    <span id="timeText" class="ttext num" dir="ltr">0:15</span>
    <div id="countdown" class="countdown" dir="ltr"></div>
  </div>
  <div id="trickBar" class="trickbar"></div>
  <div id="taskCard" class="taskcard">
    <div id="taskEq" class="task-eq" dir="ltr"></div>
    <div id="feedback" class="feedback"></div>
    <div id="taskHelp" class="task-help"></div>

// --- Bilder (immer LTR, damit Rechnungen in Arabisch nicht gespiegelt werden)

// ---------- Spielregeln (je ein Satz, siehe DEPLOY_BUILD1.md) ----------
// Score: jede richtige Antwort +1, eine falsche Antwort zieht nichts ab; Best Score je Trick (und spaeter je "Alle Tricks" pro Klasse), keine Waehrung.
// Zeit: jede Aufgabe hat ihren eigenen Balken (Klasse 1-2: 15 s, Klasse 3-4: 20 s), er wird nie kuerzer; Balken leer -> Challenge vorbei.
// Erklaerung: Bild und Schritte bei den ersten 3 Aufgaben, ab der 4. richtigen Antwort nur auf Knopfdruck oder nach einem Fehler; "Trick zeigen" kostet nichts, die Zeit laeuft weiter.
// Alles sofort spielbar, keine Sperren.
const AVAILABLE_TRICKS=TRICKS.map(x=>x.id);  // alle 43 Tricks spielbar, keine Sperren.
// "Alle Tricks gemischt": je Klasse alle Tricks ausser den Profi-Tricks; jede Aufgabe waehlt zuerst zufaellig einen Trick (nicht zweimal derselbe in Folge).
const TIME_PER_TASK={1:15,2:15,3:20,4:20};
const SHOW_HELP_UNTIL=3;
const WARN_FRACTION=0.5,ALERT_SECONDS=3;
const MIN_VISUAL_ZOOM=0.6;   // kleiner wird ein Bild nicht; passt es dann nicht, bleiben nur die Schritte (nur auf kleinen Bildschirmen)
const DEFAULT_DATA={sound:true,best:{},grade:1};

function loadData(){try{const raw=safeGet(STORAGE);const d=Object.assign(structuredClone(DEFAULT_DATA),raw?JSON.parse(raw):{});if(!d.best||typeof d.best!=='object')d.best={};d.sound=d.sound!==false;d.grade=[1,2,3,4].includes(+d.grade)?+d.grade:1;return d}catch(e){return structuredClone(DEFAULT_DATA)}}
function saveData(){safeSet(STORAGE,JSON.stringify(data))}
let data=loadData();
// Best-Schluessel: 'trick:<id>' fuer einen Trick, 'all:<klasse>' fuer "Alle Tricks gemischt".
function bestKey(mode){return String(mode).startsWith('all:')?mode:'trick:'+mode}
function bestOf(mode){return Math.max(0,Number(data.best[bestKey(mode)])||0)}
function mixIds(g){return AVAILABLE_TRICKS.filter(id=>trickGrade(id)===g&&!trickProfi(id))}

// ---------- Ton ----------
let audioCtx=null;
function beep(freq,dur,type='sine',vol=.05){if(!data.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);const now=audioCtx.currentTime;g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.start(now);o.stop(now+dur+.02)}catch(e){}}
function soundRight(){beep(523,.08);setTimeout(()=>beep(784,.12),70)}
function soundWrong(){beep(200,.14,'triangle',.05)}
function soundTick(){beep(880,.04,'square',.02)}
function soundEnd(){beep(392,.14,'triangle');setTimeout(()=>beep(262,.22,'triangle'),130)}

// ---------- Texte anwenden ----------
function exampleLine(id){const m=Object.assign({id},TRICK_EXAMPLES[id]);return trickTaskLine(m).replace('?',String(trickAnswer(m)))}
function fmtTime(sec){const s=Math.max(0,Math.ceil(sec));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function applyLanguage(){document.documentElement.lang=language;document.documentElement.dir=LANGS[language].dir;document.title=t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n,el.textContent)});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)))}
function setLanguage(mode){languageOverride=mode;safeSet(STORAGE_LANGUAGE,mode);language=mode==='system'?detectDeviceLanguage():mode;applyLanguage();renderHome();renderSettings();if(ch)renderChallenge()}

// ---------- Startseite ----------
function availableGrades(){return [...new Set(AVAILABLE_TRICKS.map(trickGrade))].sort((a,b)=>a-b)}
function bestBadge(mode){return '<span class="tc-best" aria-label="'+t('best')+'"><span class="sym" aria-hidden="true">🏆</span><b class="num">'+bestOf(mode)+'</b></span>'}
function renderHome(){const grades=availableGrades();let g=data.grade;if(!grades.includes(g))g=grades[0];

  $('trickList').innerHTML=mix+list.map(id=>'<button class="trick-card" type="button" data-trick="'+id+'">'+
    '<span class="tc-icon" aria-hidden="true">'+trickIcon(id)+'</span>'+
    '<span class="tc-copy"><b>'+t('trickName_'+id)+'</b><span class="tc-ex num" dir="ltr">'+exampleLine(id)+'</span>'+

  $('trickList').scrollTop=0}


// ---------- Challenge ----------
// phase: countdown -> running -> (transition -> running)* -> over; paused kann aus countdown/running kommen.
let ch=null,rafId=0,countdownTimer=0,transitionTimer=0;
function showScreen(name){$('homeScreen').classList.toggle('hidden',name!=='home');$('challengeScreen').classList.toggle('hidden',name!=='challenge')}
function startChallenge(mode){stopTimers();const mix=String(mode).startsWith('all:'),g=mix?+mode.slice(4):trickGrade(mode),ids=mix?mixIds(g):[mode],pools={};ids.forEach(id=>pools[id]=trickTaskPool(id));
  ch={mode,mix,ids,pools,grade:g,total:TIME_PER_TASK[g],score:0,prevBest:bestOf(mode),task:null,lastKey:'',lastId:'',input:'',revealed:true,wrong:false,feedback:'',phase:'countdown',remaining:TIME_PER_TASK[g],lastTs:0};
  closeOverlays();showScreen('challenge');nextTask();startCountdown()}
function taskKey(m){return m.id+'|'+m.a+'|'+m.b+'|'+m.p+'|'+m.target}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function nextTask(){let id=ch.ids[0],m,tries=0;
  if(ch.ids.length>1){do{id=pick(ch.ids)}while(id===ch.lastId)}
  const pool=ch.pools[id];do{m=pick(pool);tries++}while(pool.length>1&&taskKey(m)===ch.lastKey&&tries<20);
  ch.task=m;ch.lastId=id;ch.lastKey=taskKey(m);ch.input='';ch.wrong=false;ch.feedback='';ch.revealed=ch.score<SHOW_HELP_UNTIL;ch.remaining=ch.total;renderChallenge()}

function stopTimers(){cancelAnimationFrame(rafId);rafId=0;clearInterval(countdownTimer);countdownTimer=0;clearTimeout(transitionTimer);transitionTimer=0}
function startCountdown(){stopTimers();ch.phase='countdown';const bar=$('timeBar'),cd=$('countdown');let n=3;bar.classList.add('counting');cd.textContent=n;$('keypad').classList.add('locked');renderTime();soundTick();
  countdownTimer=setInterval(()=>{n--;if(n>0){cd.textContent=n;soundTick()}else if(n===0){cd.textContent=t('go');beep(988,.1)}else{clearInterval(countdownTimer);countdownTimer=0;bar.classList.remove('counting');startRunning()}},650)}
function startRunning(){if(!ch)return;ch.phase='running';$('keypad').classList.remove('locked');ch.lastTs=performance.now();rafId=requestAnimationFrame(tick)}
function tick(){if(!ch||ch.phase!=='running')return;const now=performance.now();ch.remaining-=(now-ch.lastTs)/1000;ch.lastTs=now;
  if(ch.remaining<=0){ch.remaining=0;renderTime();endChallenge(false);return}
  renderTime();rafId=requestAnimationFrame(tick)}
function renderTime(){if(!ch)return;const frac=Math.max(0,Math.min(1,ch.remaining/ch.total)),bar=$('timeBar');$('timeFill').style.width=(frac*100)+'%';$('timeText').textContent=fmtTime(ch.remaining);
  const alert=ch.remaining<=ALERT_SECONDS&&ch.phase==='running';bar.classList.toggle('alert',alert);bar.classList.toggle('warn',!alert&&frac<=WARN_FRACTION)}
function renderTiles(){$('scoreVal').textContent=ch.score;$('bestVal').textContent=Math.max(ch.prevBest,ch.score);$('bestTile').classList.toggle('beaten',ch.score>ch.prevBest&&ch.score>0)}
function renderChallenge(){if(!ch)return;const m=ch.task,id=m.id,pl=trickPlan(m);
  $('chTitle').textContent=ch.mix?'🎲 '+t('allTricks')+' · '+t('trickGrade'+ch.grade):t('trickGrade'+ch.grade);
  $('soundBtn').textContent=data.sound?'🔊':'🔇';
  renderTiles();renderTime();
  $('trickBar').innerHTML='<span class="tb-icon" aria-hidden="true">'+trickIcon(id)+'</span><b class="tb-name">'+t('trickName_'+id)+'</b><span class="tb-sep">·</span><span class="tb-ex num" dir="ltr">'+exampleLine(id)+'</span>';
  const box='<span class="ans-box'+(ch.feedback==='right'?' ok':ch.input?' filled':'')+'">'+(ch.input||'?')+'</span>';
  $('taskEq').innerHTML=trickTaskLine(m).replace('?',box);
  const show=ch.revealed||ch.wrong;
  $('taskHelp').innerHTML=show?(ch.feedback?'':'<p class="task-ask">'+t('trickAsk_'+id)+'</p>')+(pl.vis?'<div class="tk-visual">'+pl.vis+'</div>':'')+trickStepsHtml(pl.steps):'';
  $('taskHelp').classList.toggle('hidden',!show);
  $('showTrickBtn').classList.toggle('hidden',show);
  const fb=$('feedback');fb.className='feedback'+(ch.feedback==='right'?' ok':ch.feedback==='wrong'?' bad':'');fb.textContent=ch.feedback==='right'?t('trickRight'):ch.feedback==='wrong'?t('wrongSteps'):'';
  fitChallenge()}
// Alles muss ohne Scrollen auf einen Bildschirm passen: lange Rechnungen und Trick-Namen werden kleiner, grosse Bilder werden gezoomt.
function fitText(el,maxPx,minPx){if(!el)return;el.style.fontSize='';let px=maxPx||parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=px+'px';while(el.scrollWidth>el.clientWidth+1&&px>minPx){px-=1;el.style.fontSize=px+'px'}}
function fitChallenge(){const card=$('taskCard'),eq=$('taskEq'),vis=card.querySelector('.tk-visual'),help=$('taskHelp');help.classList.remove('tight','noask');card.classList.remove('scroll');
  fitText(eq,null,18);fitText($('trickBar'),null,11);if(vis){vis.style.zoom='';vis.classList.remove('hidden')}
  const over=()=>card.scrollHeight-card.clientHeight;
  if(over()>0)help.classList.add('tight');
  if(over()>0)help.classList.add('noask');
  if(vis){let z=1;while(over()>0&&z>MIN_VISUAL_ZOOM+.001){z=Math.max(MIN_VISUAL_ZOOM,z-.05);vis.style.zoom=z}
    if(over()>0&&help.querySelector('.tk-steplist')){vis.style.zoom='';vis.classList.add('hidden')}}
  if(over()>0)card.classList.add('scroll')}
window.addEventListener('resize',()=>{if(ch&&ch.task)fitChallenge()});
function pressKey(key){if(!ch||ch.phase!=='running')return;
  if(key==='back'){ch.input=ch.input.slice(0,-1);ch.feedback='';beep(300,.035);renderChallenge();return}
  if(/^\d$/.test(key)){const max=Math.min(6,String(trickAnswer(ch.task)).length+1);if(ch.input.length<max)ch.input+=key;ch.feedback='';beep(440,.035);renderChallenge();return}
  if(key==='ok'){if(!ch.input)return;submit()}}
function submit(){const m=ch.task,card=$('taskCard');
  if(Number(ch.input)===trickAnswer(m)){ch.score++;ch.feedback='right';ch.phase='transition';cancelAnimationFrame(rafId);soundRight();renderChallenge();
    const tile=$('scoreTile');tile.classList.remove('pop');void tile.offsetWidth;tile.classList.add('pop');card.classList.add('right');
    transitionTimer=setTimeout(()=>{card.classList.remove('right');if(!ch||ch.phase!=='transition')return;nextTask();startRunning()},650);return}
  ch.wrong=true;ch.feedback='wrong';ch.input='';soundWrong();renderChallenge();card.classList.remove('wrong');void card.offsetWidth;card.classList.add('wrong')}
function revealTrick(){if(!ch||ch.phase==='over')return;ch.revealed=true;beep(660,.05);renderChallenge()}
function endChallenge(quit){if(!ch||ch.phase==='over')return;stopTimers();ch.phase='over';$('keypad').classList.add('locked');renderTime();
  const key=bestKey(ch.mode),prev=bestOf(ch.mode),record=ch.score>prev;if(record){data.best[key]=ch.score;saveData()}
  const m=ch.task,sol=quit?'':'<div class="r-solution"><small>'+t('solutionWas')+'</small><div class="trick-eq" dir="ltr">'+trickTaskLine(m).replace('?','<b class="tk-ans">'+trickAnswer(m)+'</b>')+'</div></div>';
  $('resultBody').innerHTML='<div class="r-emoji" aria-hidden="true">'+(record&&ch.score>0?'🏆':quit?'🏁':'⏰')+'</div><h2>'+(quit?t('yourScore'):t('timeUp'))+'</h2>'+
    (record&&ch.score>0?'<div class="r-record">'+t('newRecord')+'</div>':'')+
    '<div class="r-tiles"><div class="r-tile score" aria-label="'+t('score')+'"><span class="sym" aria-hidden="true">🎯</span><b class="num">'+ch.score+'</b></div><div class="r-tile best" aria-label="'+t('best')+'"><span class="sym" aria-hidden="true">🏆</span><b class="num">'+Math.max(prev,ch.score)+'</b></div></div>'+sol+
    '<button class="btn primary" type="button" data-act="again">'+t('again')+'</button><button class="btn secondary" type="button" data-act="home">'+t('overview')+'</button>';
  closeOverlays();$('resultOverlay').classList.add('open');record&&ch.score>0?(soundRight(),setTimeout(soundRight,180)):soundEnd()}
function goHome(){stopTimers();ch=null;closeOverlays();showScreen('home');renderHome()}

// ---------- Pause: App im Hintergrund, Bildschirm aus oder Zurueck-Taste ----------
let pausedFrom='';
function pauseChallenge(){if(!ch||(ch.phase!=='running'&&ch.phase!=='countdown'))return;pausedFrom=ch.phase;stopTimers();$('timeBar').classList.remove('counting');ch.phase='paused';$('keypad').classList.add('locked');renderTime();$('pauseOverlay').classList.add('open')}
function resumeChallenge(){if(!ch||ch.phase!=='paused')return;$('pauseOverlay').classList.remove('open');startCountdown()}
window.appPause=pauseChallenge;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseChallenge()});
window.addEventListener('pagehide',pauseChallenge);
window.addEventListener('blur',pauseChallenge);

// ---------- Einstellungen / Hilfe ----------
function renderSettings(){$('soundToggle').innerHTML=[['on',true],['off',false]].map(([k,v])=>'<button type="button" class="'+(data.sound===v?'on':'')+'" data-sound="'+k+'">'+(v?'🔊 ':'🔇 ')+t(k)+'</button>').join('');
  $('langList').innerHTML='<button type="button" class="wide'+(languageOverride==='system'?' on':'')+'" data-lang="system">📱 '+t('languageSystem')+'</button>'+LANGUAGE_CODES.map(c=>'<button type="button" class="'+(languageOverride===c?'on':'')+'" data-lang="'+c+'" lang="'+c+'" dir="'+LANG_META[c].dir+'">'+LANG_META[c].flag+' '+LANG_META[c].name+'</button>').join('')}
function closeOverlays(){document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'))}
function openOverlay(id){$(id).classList.add('open');beep(600,.04)}

// ---------- Ereignisse ----------
$('trickList').addEventListener('click',e=>{const c=e.target.closest('[data-trick]');if(c){beep(600,.05);startChallenge(c.dataset.trick)}});
$('gradeTabs').addEventListener('click',e=>{const b=e.target.closest('[data-grade]');if(b){data.grade=+b.dataset.grade;saveData();beep(520,.04);renderHome()}});
$('keypad').addEventListener('click',e=>{const k=e.target.closest('[data-key]');if(k)pressKey(k.dataset.key)});
$('showTrickBtn').addEventListener('click',revealTrick);
$('backBtn').addEventListener('click',()=>{if(ch&&(ch.phase==='running'||ch.phase==='countdown'))pauseChallenge();else goHome()});
$('soundBtn').addEventListener('click',()=>{data.sound=!data.sound;saveData();$('soundBtn').textContent=data.sound?'🔊':'🔇';beep(600,.05)});
$('resumeBtn').addEventListener('click',resumeChallenge);
$('quitBtn').addEventListener('click',()=>endChallenge(true));
$('resultBody').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||!ch)return;if(a.dataset.act==='again')startChallenge(ch.mode);else goHome()});
$('helpBtn').addEventListener('click',()=>openOverlay('helpOverlay'));
$('settingsBtn').addEventListener('click',()=>{renderSettings();openOverlay('settingsOverlay')});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.remove('open')));
$('settingsOverlay').addEventListener('click',e=>{const l=e.target.closest('[data-lang]'),s=e.target.closest('[data-sound]');if(l)setLanguage(l.dataset.lang);if(s){data.sound=s.dataset.sound==='on';saveData();renderSettings();beep(600,.05)}});
document.addEventListener('keydown',e=>{if(!ch||ch.phase!=='running')return;if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('back');else if(e.key==='Enter')pressKey('ok')});

applyLanguage();renderHome();

</script>
<noscript><div style="position:fixed;left:12px;right:12px;bottom:12px;background:#fff;color:#13203F;border-radius:16px;padding:12px;font-weight:800;text-align:center">Für dieses Spiel muss JavaScript aktiviert sein.</div></noscript>
</body>
</html>
